<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Grammar Defender: Linie 1 Arcade Odyssey</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <!-- Fullscreen 60 FPS Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- In-Game Top Navigation & Jump Overlay -->
    <div id="combat-hud-overlay" class="combat-hud hidden">
      <div class="hud-left">
        <button id="btn-back-to-menu" class="hud-back-btn" type="button">◀ MAP</button>
        <span id="hud-level-tag">LVL 1.01</span>
      </div>

      <!-- Quick Question Jump Bar -->
      <div class="hud-center-jump">
        <label for="jump-q-input">Q#</label>
        <input id="jump-q-input" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="60" placeholder="1">
        <span id="jump-total-label">/ 18</span>
        <button id="btn-jump-q" class="btn-jump" type="button">GO</button>
      </div>

      <div class="hud-right">
        <span id="hud-score">0 PTS</span>
      </div>
    </div>

    <!-- Level Selection Screen -->
    <div id="screen-level-select" class="ui-screen">
      <header class="select-header">
        <div class="brand-row">
          <div class="stage-toggle-cluster">
            <button id="btn-stage-a1" class="stage-btn active" type="button">A1</button>
            <button id="btn-stage-a2" class="stage-btn" type="button">A2</button>
          </div>
          <h1>GRAMMAR DEFENDER</h1>
          <span class="badge-count" id="unlocked-counter">59 SECTORS</span>
        </div>
        <p class="sub-headline">Linie 1: Offizieller Grammatik-Katalog</p>

        <!-- Quick Resume Last Played Session Banner -->
        <div id="resume-banner" class="resume-banner hidden">
          <div class="resume-info">
            <span class="resume-label">LETZTE SITZUNG:</span>
            <span id="resume-text">LVL 1.01 • FRAGE 5</span>
          </div>
          <button id="btn-resume-session" class="btn-resume-action" type="button">WEITERSPIELEN ▶</button>
        </div>
        
        <!-- Chapter Filter Chips -->
        <nav class="chapter-chips" id="chapter-filter">
          <button class="chip active" data-filter="all">ALLE</button>
          <button class="chip" data-filter="K1-K4">K1–K4</button>
          <button class="chip" data-filter="K5-K8">K5–K8</button>
          <button class="chip" data-filter="K9-K12">K9–K12</button>
          <button class="chip" data-filter="K13-K16">K13–K16</button>
        </nav>
      </header>

      <!-- Smooth 120Hz Touch Scroll Container -->
      <main class="level-card-list" id="level-list-container">
        <!-- Rendered dynamically by engine.js -->
      </main>
    </div>

    <!-- On-Screen Virtual Controls -->
    <div id="touch-controls" class="hidden">
      <div id="touch-steer-zone">
        <span class="touch-steer-label">◀ SLIDE TO STEER ▶</span>
      </div>
      <div class="touch-actions">
        <button id="btn-codex" class="control-btn" type="button">CODEX</button>
        <button id="btn-fire" class="control-btn fire-glow" type="button">FIRE</button>
      </div>
    </div>

    <!-- In-Game Grammatik-Codex Sheet -->
    <div id="codex-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-bar">
          <span id="codex-level-tag">LVL 1.01</span>
          <h2 id="codex-title">Thema</h2>
          <button id="codex-close" class="close-btn" type="button">&times;</button>
        </div>
        <div class="modal-body">
          <div class="codex-section">
            <label>GRAMMATIK-REGEL</label>
            <p id="codex-rule-box"></p>
          </div>
          <div class="codex-section">
            <label>BEISPIEL AUS LINIE 1</label>
            <p id="codex-example-box"></p>
          </div>
        </div>
        <button id="btn-resume" class="btn-primary" type="button">ZURÜCK ZUR MISSION</button>
      </div>
    </div>

    <!-- Victory Screen -->
    <div id="screen-victory" class="result-modal hidden">
      <div class="result-card">
        <div class="stars-earned" id="victory-stars">★★★</div>
        <h2 id="victory-title">SEKTOR BEREINIGT!</h2>
        <p class="score-display" id="victory-score">SCORE: 12,500</p>
        <p class="rule-recap" id="victory-rule-desc"></p>
        <div class="result-actions">
          <button id="btn-next-level" class="btn-primary" type="button">NÄCHSTER SEKTOR</button>
          <button id="btn-select-map" class="btn-secondary" type="button">SEKTOR-KARTE</button>
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="screen-gameover" class="result-modal hidden">
      <div class="result-card danger">
        <h2 class="alert-text">SCHILDE KOLLABIERT</h2>
        <p class="sub-alert">Die Grammatik-Barriere wurde durchbrochen.</p>
        <p class="hint-display" id="gameover-hint"></p>
        <div class="result-actions">
          <button id="btn-retry" class="btn-primary alert-btn" type="button">NEUSTART</button>
          <button id="btn-fail-map" class="btn-secondary" type="button">SEKTOR-KARTE</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stage A1 Data Packs -->
  <script src="data_a1.js"></script>
  <script src="data_a1_k5_k8.js"></script>
  <script src="data_a1_k9_k12.js"></script>
  <script src="data_a1_k13_k16.js"></script>

  <!-- Stage A2 Data Packs -->
  <script src="data_a2_k1_k4.js"></script>
  <script src="data_a2_k5_k8.js"></script>
  <script src="data_a2_k9_k12.js"></script>
  <script src="data_a2_k13_k16.js"></script>

  <!-- Core Game Engine -->
  <script src="engine.js"></script>
</body>
</html>
